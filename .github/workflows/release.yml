name: Release

# When main carries a package.json version that has no tag yet, tag that commit vX.Y.Z and publish a GitHub release
# whose notes are the version's section of CHANGELOG.md. Bumping the version in a pull request is the whole release step.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          # the lines under "## $V" up to the next "## " heading
          awk -v v="$V" '/^## /{ if (on) exit; on = index($0, "## " v " ") == 1 || $0 == "## " v; next } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no section for $V"; exit 1; fi
          gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md
