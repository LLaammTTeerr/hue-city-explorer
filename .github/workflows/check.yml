# Height, terrain and burial checks (npm run check) on every pull request. Branch protection on main requires this
# job ("check") to pass before a pull request can merge.
# (deploy.yml runs the same checks again before it builds the site.)
name: Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
