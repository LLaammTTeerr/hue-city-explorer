<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5efe2" />
    <meta name="description" content="Huế, bên dòng Hương — khám phá trung tâm Huế trong không gian 3D dựng từ dữ liệu OpenStreetMap." />
    <title>Huế · bên dòng Hương</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1620'/%3E%3Cpath d='M3 21h26M5 21c2-9 6-9 8 0m0 0c2-9 6-9 8 0m0 0c2-9 4-9 6 0' fill='none' stroke='%23f0bd4a' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="scene" role="img" aria-label="Mô hình 3D trung tâm Huế"></canvas>
    <div id="labels" aria-hidden="false"></div>

    <div id="top-left">
      <div id="plaque" class="glass">
        <div class="plaque-head">
          <span class="seal" lang="zh-Hant" title="Thuận Hóa">順化</span>
          <div class="plaque-titles">
            <h1>Huế</h1>
            <span id="plaque-sub" class="plaque-sub"></span>
          </div>
        </div>
        <div id="plaque-stats" class="plaque-stats">
          <div class="stat"><b id="stat-buildings">—</b><span data-t="statBuildings"></span></div>
          <div class="stat"><b id="stat-places">—</b><span data-t="statPlaces"></span></div>
          <div class="stat"><b id="stat-coords">16.46°N</b><span data-t="statRiver"></span></div>
        </div>
      </div>

      <header id="search" role="search">
        <div class="bar glass">
          <span class="seal mob-seal" lang="zh-Hant" title="Thuận Hóa">順化</span>
          <button id="q-toggle" class="icon small" type="button" aria-controls="panel" aria-expanded="false">
            <svg viewBox="0 0 24 24" class="glass-ic"><circle cx="10.5" cy="10.5" r="6" /><path d="M15 15l5 5" /></svg>
          </button>
          <input id="q" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" />
          <span class="kbd" aria-hidden="true">/</span>
          <button id="q-clear" class="icon small" type="button" hidden><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg></button>
        </div>
        <div id="panel" class="glass" hidden>
          <div id="kinds" role="group"></div>
          <div id="results" role="listbox"></div>
          <p id="no-results" hidden></p>
        </div>
      </header>

      <aside id="card" class="glass" aria-labelledby="card-name" hidden>
        <button id="card-close" class="icon small" type="button"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg></button>
        <div id="card-scroll">
          <figure id="card-media" hidden>
            <button id="card-shot" type="button" disabled><img id="card-img" alt="" decoding="async" /></button>
            <figcaption><span id="card-caption"></span> <span id="card-credit"></span></figcaption>
          </figure>
          <p id="card-kind"></p>
          <h2 id="card-name" tabindex="-1"></h2>
          <p id="card-when" hidden></p>
          <p id="card-note"></p>
          <div id="card-story" hidden></div>
          <dl id="card-facts" hidden></dl>
          <p id="card-sources" hidden></p>
          <div class="card-foot">
            <p id="card-meta"></p>
            <button id="card-share" type="button"><svg viewBox="0 0 24 24"><circle cx="17.5" cy="6" r="2.5" /><circle cx="6.5" cy="12" r="2.5" /><circle cx="17.5" cy="18" r="2.5" /><path d="M8.7 10.8l6.6-3.6M8.7 13.2l6.6 3.6" /></svg><span data-t="share"></span></button>
          </div>
        </div>
      </aside>
    </div>

    <nav id="places" aria-label="Địa danh"></nav>

    <div id="top-right">
      <div id="tools" class="glass">
        <button id="btn-labels" class="u-btn on" type="button" aria-pressed="true">
          <span class="dot" aria-hidden="true"></span>
          <span class="u-txt" data-t="labelsShort"></span>
        </button>
        <button id="btn-look" class="u-btn" type="button" aria-pressed="false">
          <span class="dot" aria-hidden="true"></span>
          <span class="u-txt" data-t="lookShort"></span>
        </button>
        <span class="u-div" aria-hidden="true"></span>
        <div id="capture-wrap">
          <button id="btn-capture" class="u-btn icon-only" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="capture-menu">
            <svg viewBox="0 0 24 24"><path d="M4 8.5a2 2 0 0 1 2-2h2.2l1.4-2h4.8l1.4 2H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" /><circle cx="12" cy="13" r="3.2" /></svg>
          </button>
          <div id="capture-menu" class="glass" role="menu" hidden>
            <button type="button" role="menuitem" data-preset="screen"><span data-t="captureScreen"></span><small></small></button>
            <button type="button" role="menuitem" data-preset="2x"><span data-t="capture2x"></span><small></small></button>
            <button type="button" role="menuitem" data-preset="4k"><span data-t="capture4k"></span><small></small></button>
          </div>
        </div>
        <button id="btn-share" class="u-btn icon-only" type="button">
          <svg viewBox="0 0 24 24"><circle cx="17.5" cy="6" r="2.5" /><circle cx="6.5" cy="12" r="2.5" /><circle cx="17.5" cy="18" r="2.5" /><path d="M8.7 10.8l6.6-3.6M8.7 13.2l6.6 3.6" /></svg>
        </button>
        <div id="seg-lang" class="seg text" role="radiogroup">
          <button type="button" role="radio" data-lang="vi" lang="vi" title="Tiếng Việt" aria-label="Tiếng Việt" aria-checked="true">VI</button>
          <button type="button" role="radio" data-lang="en" lang="en" title="English" aria-label="English" aria-checked="false">EN</button>
        </div>
        <button id="btn-about" class="u-btn icon-only" type="button">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M12 11v5.5" /><circle cx="12" cy="7.8" r="0.9" class="fill" /></svg>
        </button>
      </div>
    </div>

    <div id="nav">
      <button id="btn-home" class="icon compass glass" type="button">
        <svg viewBox="0 0 48 48" id="compass-rose">
          <circle cx="24" cy="24" r="20" class="ring" />
          <g id="needle">
            <path d="M24 7l4.5 17h-9z" class="north" />
            <path d="M24 41l4.5-17h-9z" class="south" />
            <text x="24" y="5.5" text-anchor="middle">B</text>
          </g>
        </svg>
      </button>
      <div class="zoom-pill glass desk">
        <button id="btn-zin" class="z-btn" type="button"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" /></svg></button>
        <span class="z-div" aria-hidden="true"></span>
        <button id="btn-zout" class="z-btn" type="button"><svg viewBox="0 0 24 24"><path d="M6 12h12" /></svg></button>
      </div>
    </div>

    <div id="hint" class="glass" role="status"></div>

    <div id="actions" class="glass">
      <div class="time-head">
        <span class="time-title" data-t="timeOfDay"></span>
        <button id="btn-rain" class="rain-pill" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M7 14.5a4 4 0 01.6-7.95A5 5 0 0117.3 8a3.3 3.3 0 01-.3 6.5z" /><path d="M9 17.5l-1 2.5M13 17.5l-1 2.5M17 17.5l-1 2.5" /></svg>
          <span data-t="rain"></span>
        </button>
      </div>
      <div class="time-slider-wrap">
        <input id="time-slider" type="range" min="0" max="2" step="0.01" value="1" />
      </div>
      <div id="seg-time" class="time-ticks" role="radiogroup">
        <button type="button" role="radio" data-time="0" aria-checked="false"></button>
        <button type="button" role="radio" data-time="1" aria-checked="true"></button>
        <button type="button" role="radio" data-time="2" aria-checked="false"></button>
      </div>
    </div>

    <button id="attrib" type="button"></button>

    <dialog id="about" class="glass" aria-labelledby="about-title">
      <button id="about-close" class="icon small" type="button"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg></button>
      <h2 id="about-title"></h2>
      <div id="about-body"></div>
      <label class="switch"><input id="osm-only" type="checkbox" /><span data-t="osmOnly"></span></label>
      <p class="fine" id="about-fine"></p>
    </dialog>

    <div id="loader">
      <div>
        <span class="seal big" lang="zh-Hant">順化</span>
        <h1>Huế</h1>
        <p id="loader-text"></p>
        <div class="bar"><i id="loader-bar"></i></div>
        <!-- shown instead of the bar when the scene cannot start (no WebGL, or a load error): src/ui/fallback.js -->
        <div id="fail" hidden>
          <h2 id="fail-title"></h2>
          <p id="fail-body"></p>
          <p id="fail-alt"></p>
          <div class="fail-actions">
            <button id="btn-retry" class="tog primary" type="button"></button>
            <button id="btn-browse" class="tog" type="button" hidden></button>
          </div>
          <p id="fail-status" role="status"></p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
