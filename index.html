<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#efe6d2" />
    <meta name="description" content="Huế, bên dòng Hương — khám phá trung tâm Huế trong không gian 3D dựng từ dữ liệu OpenStreetMap." />
    <title>Huế · bên dòng Hương</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1620'/%3E%3Cpath d='M3 21h26M5 21c2-9 6-9 8 0m0 0c2-9 6-9 8 0m0 0c2-9 4-9 6 0' fill='none' stroke='%23f0bd4a' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="scene" aria-label="Mô hình 3D trung tâm Huế"></canvas>
    <div id="labels" aria-hidden="false"></div>

    <header id="brand">
      <div class="mast">
        <span class="seal" lang="zh-Hant" title="Thuận Hóa">順化</span>
        <div>
          <h1>Huế</h1>
          <p data-t="tagline"></p>
        </div>
      </div>
      <nav id="places" aria-label="Địa danh"></nav>
    </header>

    <div id="tools">
      <button id="btn-lang" class="chip" type="button"></button>
      <button id="btn-labels" class="icon on" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M4 6h10l6 6-6 6H4z" /><circle cx="8.5" cy="12" r="1.3" class="fill" /></svg>
      </button>
      <button id="btn-about" class="icon" type="button">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M12 11v5.5" /><circle cx="12" cy="7.8" r="0.9" class="fill" /></svg>
      </button>
    </div>

    <div id="era" class="seg" role="radiogroup">
      <button type="button" role="radio" data-era="0" aria-checked="false"><span class="long"></span><span class="short"></span><small></small></button>
      <button type="button" role="radio" data-era="1" aria-checked="false"><span class="long"></span><span class="short"></span><small></small></button>
      <button type="button" role="radio" data-era="2" aria-checked="true"><span class="long"></span><span class="short"></span><small></small></button>
    </div>

    <div id="nav">
      <button id="btn-home" class="icon compass" type="button">
        <svg viewBox="0 0 48 48" id="compass-rose">
          <circle cx="24" cy="24" r="21" class="ring" />
          <g id="needle">
            <path d="M24 6l5 18h-10z" class="north" />
            <path d="M24 42l5-18h-10z" class="south" />
            <text x="24" y="5.5" text-anchor="middle">B</text>
          </g>
        </svg>
      </button>
      <button id="btn-zin" class="icon desk" type="button"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" /></svg></button>
      <button id="btn-zout" class="icon desk" type="button"><svg viewBox="0 0 24 24"><path d="M6 12h12" /></svg></button>
    </div>

    <aside id="card" hidden>
      <button id="card-close" class="icon small" type="button"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg></button>
      <p id="card-kind"></p>
      <h2 id="card-name"></h2>
      <p id="card-note"></p>
      <p id="card-meta"></p>
    </aside>

    <div id="hint" role="status"></div>

    <div id="actions">
      <button id="btn-ride" class="cta" type="button">
        <svg viewBox="0 0 24 24"><path d="M2.5 15h19l-2.6 4H5.1z" /><path d="M7 15v-4h9v4M5.5 11h12l-1.5-2.5H7z" /><path d="M19 15l2.5-3.5" /></svg>
        <span data-t="ride"></span>
      </button>
      <button id="btn-rain" class="tog" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M7 14.5a4 4 0 01.6-7.95A5 5 0 0117.3 8a3.3 3.3 0 01-.3 6.5z" /><path d="M9 17.5l-1 2.5M13 17.5l-1 2.5M17 17.5l-1 2.5" /></svg>
        <span data-t="rain"></span>
      </button>
      <div id="seg-time" class="seg" role="radiogroup">
        <button type="button" role="radio" data-time="0" aria-checked="true">
          <svg viewBox="0 0 24 24"><path d="M3 18h18M7 18a5 5 0 0110 0M12 6v3M5.2 9.2l2 2M18.8 9.2l-2 2" /></svg>
        </button>
        <button type="button" role="radio" data-time="1" aria-checked="false">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8" /></svg>
        </button>
        <button type="button" role="radio" data-time="2" aria-checked="false">
          <svg viewBox="0 0 24 24"><path d="M19 14.5A7.5 7.5 0 019.5 5a7.5 7.5 0 109.5 9.5z" /></svg>
        </button>
      </div>
    </div>

    <div id="ride-hud" hidden>
      <p id="ride-cap"></p>
      <div class="row">
        <input id="ride-scrub" type="range" min="0" max="1000" value="0" aria-label="Hành trình" />
        <button id="ride-exit" class="chip" type="button"></button>
      </div>
    </div>

    <button id="attrib" type="button"></button>

    <dialog id="about">
      <button id="about-close" class="icon small" type="button"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></svg></button>
      <h2 id="about-title"></h2>
      <div id="about-body"></div>
      <label class="switch"><input id="osm-only" type="checkbox" /><span data-t="osmOnly"></span></label>
      <p class="fine" id="about-fine"></p>
    </dialog>

    <div id="loader">
      <div>
        <span class="seal big" lang="zh-Hant">順化</span>
        <h1>Huế</h1>
        <p id="loader-text"></p>
        <div class="bar"><i id="loader-bar"></i></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
